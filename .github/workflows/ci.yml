name: Typecheck LUMI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/universal-bot-platform, main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
